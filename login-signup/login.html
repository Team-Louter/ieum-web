<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <img src="ieum-logo.png" alt="로고" id="ieum-logo">

  <form>
    <div class="input-group">
    <input type="text" id="user-id" placeholder=" " required>
    <label for="user-id">아이디</label>
  </div>

  <div class="input-group">
    <input type="password" id="user-pw" placeholder=" " required>
    <label for="user-pw">비밀번호</label>
  </div>

    <p class="error-msg">아이디 또는 비밀번호가 맞지 않습니다.</p>

    <button type="submit" class="login">로그인</button>

    <button type="button" class="google-login">
      <img src="google-logo.png" alt="구글 로고" class="google-logo">
      <span>Google 로그인</span>
    </button> 
  </form>

  <div class="links">
    <a href="find-id.html" class="find">아이디 찾기</a>
    <a href="find-pw.html" class="find">비밀번호 찾기</a>
  </div>

  <div class="signup-group">
    <a href="signup-guardian.html" class="signup">사용자 계정 만들기</a>
    <a href="signup-user.html" class="signup">보호자 계정 만들기</a>
  </div>
  

  <script src="login.js"></script>
</body>
</html>
